<mat-toolbar>
    <span routerLink="/" class="link">Post List App</span>
    <span class="spacer"></span>
    <ul>
        <li *ngIf="userIsAuthenticated">
            <a mat-button routerLink="/createPost" routerLinkActive="active-link" class="link">New Post</a>
        </li>
        <li *ngIf="!userIsAuthenticated">
            <a mat-button routerLink="/login" routerLinkActive="active-link" class="link">Login</a>
        </li>
        <li *ngIf="!userIsAuthenticated">
            <a mat-button routerLink="/signup" routerLinkActive="active-link" class="link">Sign Up</a>
        </li>
        <li *ngIf="userIsAuthenticated">
            <button mat-button  class="logout" (click)="onLogOut()">Log out</button>
        </li>
    </ul>
</mat-toolbar>
